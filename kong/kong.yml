# Load Kong declaratively without a database.
_format_version: "3.0"
_transform: true

services:
  - name: backend-service
    url: http://backend:5000

routes:
  # Expose the health check.
  - name: health-check
    service: backend-service
    paths:
      - /health
    methods:
      - GET
    strip_path: false

  # Rate limit ping requests.
  - name: ping-endpoint
    service: backend-service
    paths:
      - /api/ping
    methods:
      - GET
    strip_path: false
    plugins:
      - name: rate-limiting
        config:
          minute: 100
          policy: local
          fault_tolerant: true

  # Validate the environment and rate limit requests.
  - name: hello-endpoint
    service: backend-service
    paths:
      - /api/hello
    methods:
      - GET
    strip_path: false
    plugins:
      - name: x-environment-validator
        config:
          allowed_environments: "DEV,UAT,PROD"
          header_name: "x-environment"
      - name: rate-limiting
        config:
          minute: 50
          policy: local
          fault_tolerant: true

  # Require an API key and rate limit requests.
  - name: data-endpoint
    service: backend-service
    paths:
      - /api/data
    methods:
      - GET
    strip_path: false
    plugins:
      - name: key-auth
        config:
          key_names:
            - apikey
          hide_credentials: false
      - name: rate-limiting
        config:
          minute: 30
          policy: local
          fault_tolerant: true

# Define credentials for key authentication.
consumers:
  - username: demo-user
    custom_id: demo-user-001
    keyauth_credentials:
      - key: demo-api-key-12345
        tags:
          - demo

  - username: test-user
    custom_id: test-user-002
    keyauth_credentials:
      - key: test-api-key-67890
        tags:
          - test


