# Run the stack on one network.
services:
  backend:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: kong-backend
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    environment:
      - NODE_ENV=production
    networks:
      - kong-net
    # Use the image healthcheck.
    restart: unless-stopped

  # Load Kong in DB-less mode.
  kong:
    build:
      context: ./kong
      dockerfile: Dockerfile
    container_name: kong-gateway
    depends_on:
      - backend
    ports:
      - "${KONG_PROXY_PORT:-8000}:8000"
      - "${KONG_ADMIN_PORT:-8001}:8001"
    environment:
      - KONG_DATABASE=off
      - KONG_DECLARATIVE_CONFIG=/etc/kong/kong.yml
      - KONG_PROXY_LISTEN=0.0.0.0:8000
      - KONG_ADMIN_LISTEN=0.0.0.0:8001
      - KONG_LOG_LEVEL=info
      - KONG_PLUGINS=bundled,x-environment-validator
    # Include Kong config in the image.
    networks:
      - kong-net
    # Use the image healthcheck.
    restart: unless-stopped

  # Run Jenkins with the pipeline job configured.
  jenkins:
    build:
      context: ./jenkins
      dockerfile: Dockerfile
    container_name: kong-jenkins
    user: root
    ports:
      - "${JENKINS_PORT:-8080}:8080"
    environment:
      - JENKINS_OPTS=--prefix=/
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      - .:/workspace
    networks:
      - kong-net
    restart: unless-stopped

  # Trigger the pipeline from the command line.
  pipeline:
    profiles: ["ci"]
    build:
      context: ./tests
      dockerfile: Dockerfile
    container_name: kong-pipeline
    environment:
      - JENKINS_URL=http://jenkins:8080
      - JOB_NAME=kong-poc-pipeline
      - JENKINS_AUTH=admin:admin
      - REPORT_URL=http://localhost:${REPORT_PORT:-8090}
    networks:
      - kong-net
    restart: "no"

  # Serve the generated report.
  report:
    image: nginx:alpine
    container_name: kong-report
    ports:
      - "${REPORT_PORT:-8090}:80"
    volumes:
      - ./reports:/usr/share/nginx/html:ro
    networks:
      - kong-net
    restart: unless-stopped

  # Print service links after startup.
  info:
    image: alpine:3.20
    container_name: kong-info
    depends_on:
      backend:
        condition: service_healthy
      kong:
        condition: service_healthy
    volumes:
      - ./reports:/reports
    command:
      - sh
      - -c
      - |
        echo ""
        echo "##############################################################################"
        echo "#"
        echo "#   STACK IS UP"
        echo "#"
        echo "#   Kong proxy    http://localhost:${KONG_PROXY_PORT:-8000}"
        echo "#   Kong admin    http://localhost:${KONG_ADMIN_PORT:-8001}"
        echo "#   Backend       http://localhost:${BACKEND_PORT:-5000}"
        echo "#   Jenkins       http://localhost:${JENKINS_PORT:-8080}   (admin / admin)"
        echo "#"
        echo "#   TEST REPORT   http://localhost:${REPORT_PORT:-8090}"
        echo "#"
        echo "#   Run the kong-poc-pipeline job in Jenkins to generate the report,"
        echo "#   or run:  docker-compose --profile ci up pipeline"
        echo "#"
        echo "##############################################################################"
        echo ""
    networks:
      - kong-net
    restart: "no"

networks:
  kong-net:
    driver: bridge

volumes:
  jenkins_home:


