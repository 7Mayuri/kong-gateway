# Runs the Node.js backend and Kong gateway together on one network.
services:
  backend:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: kong-backend
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    environment:
      - NODE_ENV=production
    networks:
      - kong-net
    # Healthcheck comes from app/Dockerfile (the node image has no curl).
    restart: unless-stopped

  # Kong loads kong/kong.yml at startup (db-less mode, no database needed).
  kong:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kong-gateway
    depends_on:
      - backend
    ports:
      - "${KONG_PROXY_PORT:-8000}:8000"
      - "${KONG_ADMIN_PORT:-8001}:8001"
    environment:
      - KONG_DATABASE=off
      - KONG_DECLARATIVE_CONFIG=/etc/kong/kong.yml
      - KONG_PROXY_LISTEN=0.0.0.0:8000
      - KONG_ADMIN_LISTEN=0.0.0.0:8001
      - KONG_LOG_LEVEL=info
      - KONG_PLUGINS=bundled,x-environment-validator
    # kong.yml and the plugin are baked into the image by ./Dockerfile,
    # no bind mount needed (also keeps this working when Jenkins runs it via docker.sock).
    networks:
      - kong-net
    # Healthcheck comes from ./Dockerfile.
    restart: unless-stopped

  # Boots with the pipeline job pre-created from ./Jenkinsfile (see jenkins/casc.yaml).
  # Runs as root so it can use the mounted host docker.sock regardless of host GID.
  jenkins:
    build:
      context: ./jenkins
      dockerfile: Dockerfile
    container_name: kong-jenkins
    user: root
    ports:
      - "${JENKINS_PORT:-8080}:8080"
    environment:
      - JENKINS_OPTS=--prefix=/
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      - .:/workspace
    networks:
      - kong-net
    restart: unless-stopped

  # Opt-in: triggers the Jenkins pipeline from the command line instead of the UI.
  #   docker-compose --profile ci up pipeline
  pipeline:
    profiles: ["ci"]
    build:
      context: ./tests
      dockerfile: Dockerfile
    container_name: kong-pipeline
    environment:
      - JENKINS_URL=http://jenkins:8080
      - JOB_NAME=kong-poc-pipeline
      - JENKINS_AUTH=admin:admin
      - REPORT_URL=http://localhost:${REPORT_PORT:-8090}
    networks:
      - kong-net
    restart: "no"

  # Serves ./reports so the generated report has a real clickable URL.
  report:
    image: nginx:alpine
    container_name: kong-report
    ports:
      - "${REPORT_PORT:-8090}:80"
    volumes:
      - ./reports:/usr/share/nginx/html:ro
    networks:
      - kong-net
    restart: unless-stopped

  # Prints where everything is as soon as the stack is up, then exits.
  info:
    image: alpine:3.20
    container_name: kong-info
    depends_on:
      backend:
        condition: service_healthy
      kong:
        condition: service_healthy
    volumes:
      - ./reports:/reports
    command:
      - sh
      - -c
      - |
        [ -f /reports/index.html ] || cp /reports/placeholder.html /reports/index.html
        echo ""
        echo "##############################################################################"
        echo "#"
        echo "#   STACK IS UP"
        echo "#"
        echo "#   Kong proxy    http://localhost:${KONG_PROXY_PORT:-8000}"
        echo "#   Kong admin    http://localhost:${KONG_ADMIN_PORT:-8001}"
        echo "#   Backend       http://localhost:${BACKEND_PORT:-5000}"
        echo "#   Jenkins       http://localhost:${JENKINS_PORT:-8080}   (admin / admin)"
        echo "#"
        echo "#   TEST REPORT   http://localhost:${REPORT_PORT:-8090}"
        echo "#"
        echo "#   Run the kong-poc-pipeline job in Jenkins to generate the report,"
        echo "#   or run:  docker-compose --profile ci up pipeline"
        echo "#"
        echo "##############################################################################"
        echo ""
    networks:
      - kong-net
    restart: "no"

networks:
  kong-net:
    driver: bridge

volumes:
  jenkins_home:


